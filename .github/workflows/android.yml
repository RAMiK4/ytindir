name: YTindir APK

on:
  push:
    branches: [main]
    # documentation, CI and release notes changes don't need a new release
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - 'fastlane/**'
      - '.github/**'
      - 'release-notes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Check signing password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret is missing. Add it under Settings > Secrets and variables > Actions." | tee build.log
            exit 1
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          touch keystore.properties local.properties
          chmod +x gradlew
          # test builds (branches other than main) only need the arm64 APK: no universal APK
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            sed -i 's/universalApk true/universalApk false/' app/build.gradle
          fi
          ./gradlew assembleFossRelease --stacktrace 2>&1 | tee build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR=app/build/outputs/apk/foss/release
          VERSION=$(ls $DIR/*arm64-v8a*.apk | sed -E 's/.*YTindir-(.*)-arm64-v8a\.apk/\1/')
          mkdir -p out
          # Release notes: release-notes/vX.Y.Z.md when there is one (written and checked before the
          # release), otherwise the commit message without its trailer lines
          if [ -f "release-notes/v${VERSION}.md" ]; then
            cp "release-notes/v${VERSION}.md" notes.md
          else
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="v${VERSION}-build${{ github.run_number }}"
            # GitHub lists a release's files by name: "YTindir-v…" sorts before "YTindir-x…"
            cp $DIR/*arm64-v8a*.apk "out/YTindir-v${VERSION}_arm64.apk"
            # the same name in every release, so this link always gives the newest one:
            # https://github.com/${{ github.repository }}/releases/latest/download/YTindir-x-universal.apk
            cp $DIR/*universal*.apk "out/YTindir-x-universal.apk"
            gh release create "$TAG" "out/YTindir-v${VERSION}_arm64.apk" \
              --title "YTindir $VERSION (build ${{ github.run_number }})" \
              --notes-file notes.md \
              --target "${{ github.sha }}" --latest
            gh release upload "$TAG" "out/YTindir-x-universal.apk"
          else
            # Test builds of other branches: a pre-release with "beta" in its tag, which the
            # app's updater skips unless beta updates are turned on, so nobody gets it by accident
            TAG="v${VERSION}-beta-build${{ github.run_number }}"
            cp $DIR/*arm64-v8a*.apk "out/YTindir-v${VERSION}-test_arm64.apk"
            gh release create "$TAG" "out/YTindir-v${VERSION}-test_arm64.apk" \
              --title "YTindir $VERSION test (${{ github.ref_name }}, build ${{ github.run_number }})" \
              --notes-file notes.md \
              --target "${{ github.sha }}" --prerelease --latest=false
            # Only the newest test build is kept: older "-beta-build" pre-releases and their tags go
            # (normal releases are never touched)
            gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E -- '-beta-build[0-9]+$' | while read -r OLD; do
              if [ "$OLD" != "$TAG" ]; then
                gh release delete "$OLD" --yes --cleanup-tag || true
              fi
            done
            # the fixed "beta-test-latest" release held the universal test APK; test builds no longer have one
            gh release delete beta-test-latest --yes --cleanup-tag || true
          fi

      - name: Save failure log to ci-logs branch
        if: failure()
        run: |
          (tail -n 400 build.log 2>/dev/null || echo "no build.log") > /tmp/build.log
          echo "commit ${{ github.sha }} run ${{ github.run_number }}" > /tmp/info.txt
          mkdir /tmp/logs && cd /tmp/logs
          git init -q -b ci-logs
          cp /tmp/build.log /tmp/info.txt .
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
