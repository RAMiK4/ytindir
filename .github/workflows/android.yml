name: YTindr APK

on:
  push:
    branches: [main]
    # documentation-only changes don't need a new release
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - 'fastlane/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Check signing password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret is missing. Add it under Settings > Secrets and variables > Actions." | tee build.log
            exit 1
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          touch keystore.properties local.properties
          chmod +x gradlew
          ./gradlew assembleFossRelease --stacktrace 2>&1 | tee build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR=app/build/outputs/apk/foss/release
          VERSION=$(ls $DIR/*arm64-v8a*.apk | sed -E 's/.*YTindr-(.*)-arm64-v8a\.apk/\1/')
          TAG="v${VERSION}-build${{ github.run_number }}"
          mkdir -p out
          cp $DIR/*arm64-v8a*.apk "out/YTindr-v${VERSION}_arm64.apk"
          # Release notes: the commit message without its trailer lines
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          gh release create "$TAG" out/*.apk \
            --title "YTindr $VERSION (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --target "${{ github.sha }}" --latest

      - name: Save failure log to ci-logs branch
        if: failure()
        run: |
          (tail -n 400 build.log 2>/dev/null || echo "no build.log") > /tmp/build.log
          echo "commit ${{ github.sha }} run ${{ github.run_number }}" > /tmp/info.txt
          mkdir /tmp/logs && cd /tmp/logs
          git init -q -b ci-logs
          cp /tmp/build.log /tmp/info.txt .
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
